resources:
  jobs:
    my_job:
      name: my_job
      tags: {domain: debug}
      tasks:
        - task_key: main
          environment_key: default
          spark_python_task:
            python_file: ../src/main.py
      environments:
        - {environment_key: default, spec: {client: "1"}}
    bad_cluster_job:
      name: bad_cluster_job
      tags: {domain: debug}
      job_clusters:
        - job_cluster_key: main
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: i3.xlarge
            num_workers: 1
      tasks:
        - task_key: run
          job_cluster_key: main
          spark_python_task:
            python_file: ../src/main.py
