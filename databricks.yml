# This is a Databricks asset bundle definition for all_resources.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: all_resources
  # uuid: 1cd20fde-0bb0-4464-a866-6f91355ae927

include:
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  notifications:
    description: The email addresses to use for failure notifications

resources:
  # apps:
  # my_app:
  #   name: my-app
  #   source_code_path: "."

  clusters:
    my_cluster:
      autotermination_minutes: 30
      aws_attributes:
        zone_id: auto
        availability: ON_DEMAND
        first_on_demand: 1
        spot_bid_price_percent: 100
      cluster_name: my_personal_cluster
      data_security_mode: SINGLE_USER
      is_single_node: true
      kind: CLASSIC_PREVIEW
      node_type_id: rd-fleet.xlarge
      single_user_name: ilya.kuznetsov@databricks.com
      spark_version: 16.4.x-scala2.12
      policy_id: 1562FBDFAD000F01
      use_ml_runtime: true

      custom_tags:
        ResourceClass: SingleNode
      runtime_engine: STANDARD
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: local[*, 4]
  dashboards:
    my_dashboard:
      display_name: my_dashboard
      warehouse_id: dd43ee29fedd958d

  experiments:
    my_experiment:
      name: /Users/ilya.kuznetsov@databricks.com/my-experiment

  jobs:
    my_job:
      name: '[dev ilya_kuznetsov] my_jobs'

      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
  model_serving_endpoints:
    my_model_serving_endpoint:
      name: my_model_serving_endpoint

  models:
    my_model:
      name: my_model

  pipelines:
    my_pipeline:
      name: my_pipeline
      libraries:
        - glob:
            include: ./notebook.ipynb
      tags:
        dev: ilya_kuznetsov
        # quality_monitors:
        #   my_quality_monitor:
        #     table_name: ${var.catalog}.${var.schema}.orders_daily
        #     output_schema_name: ${var.catalog}.${var.schema}
        #     assets_dir: /Users/ilya.kuznetsov@databricks.com/my_quality_monitor/assets
        #     snapshot: {}
      target: main

      root_path: /Workspace/Users/ilya.kuznetsov@databricks.com/all_resources
  registered_models:
    my_registered_model:
      name: my_registered_model
      catalog_name: ${var.catalog}
      schema_name: ${var.catalog}

  schemas:
    my_schema:
      name: my_schema
      catalog_name: ${var.catalog}

  # secret_scopes:
  #   my_secret_scope:
  #     name: ${workspace.current_user.short_name}_my_secret_scope

  volumes:
    my_volume:
      name: "my_volume"
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}

  sql_warehouses:
    sql_warehouse1:
      name: "Ilya Kuznetsov's warehouse"
      cluster_size: X-Large

  # database_instances:
  #   db_instance:
  #     name: ilya-k-db-instance
  #     capacity: CU_2

# database_catalogs:
#   db_catalog:
#     name: ilya_k_db_catalog
#     database_name: databricks_postgres
#     database_instance_name: ilya-k-db-instance

# synced_database_tables:
#   sync_db_table:
#     name: ilya_k_sync_table
#     database_instance_name: ilya-k-db-instance
#     spec:
#       create_database_objects_if_missing: true
#       source_table_full_name: 'my_source_table'
#       scheduling_policy: SNAPSHOT
# primary_key_columns:
#   - my_pk_column
# new_pipeline_spec:
#   storage_catalog: 'my_delta_catalog'
#   storage_schema: 'my_delta_schema'

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
    # presets:
    #   source_linked_deployment: false
    variables:
      catalog: main
      schema: ${workspace.current_user.short_name}
      notifications: []
    # permissions:
    #   - level: CAN_MANAGE
    #     user_name: ilya.kuznetsov@databricks.com
