# all_resources — debug_me: reproduce a CREATE-time deploy failure (bad node_type_id).
bundle:
  name: all_resources

experimental:
  record_deployment_history: true

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
      - level: CAN_MANAGE
        group_name: users
