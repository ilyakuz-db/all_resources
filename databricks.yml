# This is a Databricks asset bundle definition for all_resources.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: all_resources
  # uuid: 1cd20fde-0bb0-4464-a866-6f91355ae927

include:
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  notifications:
    description: The email addresses to use for failure notifications
  dns_prefix:
    description: DNS-compliant user prefix (lowercase alphanumeric and hyphens only)
  pg_version:
    description: The PostgreSQL version for postgres projects
    default: "16"

resources:
  # apps:
  #   my_app:
  #     name: ${var.dns_prefix}-my-app
  #     source_code_path: "."

  # catalogs:
  #   my_catalog:
  #     name: ${workspace.current_user.short_name}_catalog

  clusters:
    my_cluster:
      autotermination_minutes: 30
      aws_attributes:
        zone_id: auto
      cluster_name: ${workspace.current_user.short_name}_personal_cluster
      data_security_mode: SINGLE_USER
      is_single_node: true
      kind: CLASSIC_PREVIEW
      node_type_id: rd-fleet.xlarge
      single_user_name: ${workspace.current_user.userName}
      spark_version: 16.4.x-scala2.12
      policy_id: 1562FBDFAD000F01
      use_ml_runtime: true

  dashboards:
    my_dashboard:
      display_name: my_dashboard
      warehouse_id: dd43ee29fedd958d

  # database_catalogs:
  #   db_catalog:
  #     name: ${workspace.current_user.short_name}_db_catalog
  #     database_name: databricks_postgres
  #     database_instance_name: ${var.dns_prefix}-db-instance

  database_instances:
    db_instance:
      name: ${var.dns_prefix}-db-instance
      capacity: CU_2

  experiments:
    my_experiment:
      name: /Users/${workspace.current_user.userName}/my-experiment

  # external_locations:
  #   my_external_location:
  #     name: ${workspace.current_user.short_name}_external_location
  #     url: ${var.external_location_url}
  #     credential_name: ${var.external_location_credential}

  jobs:
    my_job:
      name: my_job

  model_serving_endpoints:
    my_model_serving_endpoint:
      name: ${workspace.current_user.short_name}_my_model_serving_endpoint

  # models:
  #   my_model:
  #     name: my_model

  pipelines:
    my_pipeline:
      name: my_pipeline
      libraries:
        - notebook:
            path: ./notebook.ipynb

  postgres_branches:
    my_pg_branch:
      parent: ${resources.postgres_projects.my_pg_project.id}
      branch_id: ${var.dns_prefix}-pg-branch
      no_expiry: true

  postgres_endpoints:
    my_pg_endpoint:
      parent: ${resources.postgres_branches.my_pg_branch.id}
      endpoint_id: ${var.dns_prefix}-pg-endpoint
      endpoint_type: ENDPOINT_TYPE_READ_WRITE

  postgres_projects:
    my_pg_project:
      project_id: ${var.dns_prefix}-pg-project
      display_name: ${workspace.current_user.short_name}_pg_project
      pg_version: ${var.pg_version}

  quality_monitors:
    my_quality_monitor:
      table_name: ${var.catalog}.${var.schema}.orders_daily
      output_schema_name: ${var.catalog}.${var.schema}
      assets_dir: /Users/${workspace.current_user.userName}/my_quality_monitor/assets
      snapshot: {}

  registered_models:
    my_registered_model:
      name: my_registered_model
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}

  schemas:
    my_schema:
      name: my_schema
      catalog_name: ${var.catalog}

  secret_scopes:
    my_secret_scope:
      name: ${workspace.current_user.short_name}_my_secret_scope

  sql_warehouses:
    sql_warehouse1:
      name: ${workspace.current_user.short_name}_warehouse
      cluster_size: X-Large

  # synced_database_tables:
  #   sync_db_table:
  #     name: ${workspace.current_user.short_name}_sync_table
  #     database_instance_name: ${var.dns_prefix}-db-instance
  #     spec:
  #       create_database_objects_if_missing: true
  #       source_table_full_name: 'my_source_table'
  #       scheduling_policy: SNAPSHOT
  #       primary_key_columns:
  #         - my_pk_column
  #       new_pipeline_spec:
  #         storage_catalog: ${var.catalog}
  #         storage_schema: ${var.schema}

  volumes:
    my_volume:
      name: ${workspace.current_user.short_name}_my_volume
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://e2-dogfood.staging.cloud.databricks.com
    presets:
      source_linked_deployment: false
    variables:
      catalog: main
      schema: ${workspace.current_user.short_name}
      notifications: []
      dns_prefix: ilya-kuznetsov
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}
