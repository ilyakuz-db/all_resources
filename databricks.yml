# This is a Databricks asset bundle definition for all_resources.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: all_resources
  # uuid: 1cd20fde-0bb0-4464-a866-6f91355ae927

include:
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  notifications:
    description: The email addresses to use for failure notifications

resources:
  # apps:
  # my_app:
  #   name: my-app
  #   source_code_path: "."

  clusters:
    my_cluster:
      autotermination_minutes: 30
      aws_attributes:
        zone_id: auto
        availability: ON_DEMAND
        first_on_demand: 1
        spot_bid_price_percent: 100
      cluster_name: my_personal_cluster
      data_security_mode: SINGLE_USER
      is_single_node: true
      kind: CLASSIC_PREVIEW
      node_type_id: rd-fleet.xlarge
      single_user_name: ilya.kuznetsov@databricks.com
      spark_version: 16.4.x-scala2.12
      policy_id: 1562FBDFAD000F01
      use_ml_runtime: true


      custom_tags:
        ResourceClass: SingleNode
      driver_node_type_id: rd-fleet.xlarge
      enable_elastic_disk: true
      runtime_engine: STANDARD
      spark_conf:
        spark.databricks.cluster.profile: singleNode
        spark.master: local[*, 4]
  dashboards:
    my_dashboard:
      display_name: my_dashboard
      warehouse_id: dd43ee29fedd958d

  experiments:
    my_experiment:
      name: /Users/ilya.kuznetsov@databricks.com/my-experiment


      artifact_location: dbfs:/databricks/mlflow-tracking/2165795372213227
  jobs:
    my_job:
      name: my_job


      tags:
        more: tags
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      queue:
        enabled: false
      webhook_notifications:
        on_failure:
          - id: a3ed17dd-2658-45fc-9b45-850205add9a8
        on_success:
          - id: a3ed17dd-2658-45fc-9b45-850205add9a8
  model_serving_endpoints:
    my_model_serving_endpoint:
      name: my_model_serving_endpoint

  models:
    my_model:
      name: my_model

  pipelines:
    my_pipeline:
      name: my_pipeline
      libraries:
        - notebook:
            path: ./notebook.ipynb

      target: main
  # quality_monitors:
  #   my_quality_monitor:
  #     table_name: ${var.catalog}.${var.schema}.orders_daily
  #     output_schema_name: ${var.catalog}.${var.schema}
  #     assets_dir: /Users/ilya.kuznetsov@databricks.com/my_quality_monitor/assets
  #     snapshot: {}


  registered_models:
    my_registered_model:
      name: my_registered_model
      catalog_name: ${var.catalog}
      schema_name: ${var.catalog}


      full_name: main.main.dev_ilya_kuznetsov_my_registered_model
      metastore_id: 19a85dee-54bc-43a2-87ab-023d0ec16013
      owner: ilya.kuznetsov@databricks.com
      storage_location: s3://us-west-2-extstaging-managed-catalog-test-bucket-1/19a85dee-54bc-43a2-87ab-023d0ec16013/models/b5d1c4ea-6ef9-4d82-ad3a-a7b601a6e7bd
  schemas:
    my_schema:
      name: my_schema
      catalog_name: ${var.catalog}

  # secret_scopes:
  #   my_secret_scope:
  #     name: ${workspace.current_user.short_name}_my_secret_scope


  volumes:
    my_volume:
      name: "my_volume"
      catalog_name: ${var.catalog}
      schema_name: ${var.schema}


      storage_location: s3://us-west-2-extstaging-managed-catalog-test-bucket-1/19a85dee-54bc-43a2-87ab-023d0ec16013/volumes/744e3601-7b86-4a36-816a-5df7a914b90d
  sql_warehouses:
    sql_warehouse1:
      name: "Ilya Kuznetsov's warehouse"
      cluster_size: X-Large


      creator_name: ilya.kuznetsov@databricks.com
      # database_instances:
      #   db_instance:
      #     name: ilya-k-db-instance
      #     capacity: CU_2

      min_num_clusters: 1
      warehouse_type: CLASSIC

